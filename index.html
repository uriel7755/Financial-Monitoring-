<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> Transaction Manager
            </h1>
            <button onclick="clearAllTransactions()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded transition text-indigo-100">
                <i class="fa-solid fa-trash-can mr-1"></i> Clear Data
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto px-4 py-6 flex-grow grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Left Column: Add Transaction & Summary Stats -->
        <div class="md:col-span-1 space-y-6">
            
            <!-- Summary Card -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Overview</h2>
                <div>
                    <p class="text-xs text-slate-500">Total Balance</p>
                    <p id="net-balance" class="text-2xl font-bold text-slate-800">$0.00</p>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
                    <div>
                        <p class="text-xs text-emerald-600 font-medium">Income</p>
                        <p id="total-income" class="text-sm font-semibold text-emerald-600">+$0.00</p>
                    </div>
                    <div>
                        <p class="text-xs text-rose-600 font-medium">Expense</p>
                        <p id="total-expense" class="text-sm font-semibold text-rose-600">-$0.00</p>
                    </div>
                </div>
            </div>

            <!-- Form Card -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-md font-semibold text-slate-700 mb-4">Add Transaction</h2>
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Description</label>
                        <input type="text" id="description" required placeholder="e.g., Grocery shopping" 
                            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Amount ($)</label>
                        <input type="number" step="0.01" id="amount" required placeholder="0.00" 
                            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Type</label>
                        <select id="type" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm">
                        Add Transaction
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Column: Transaction History -->
        <div class="md:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col">
            <h2 class="text-md font-semibold text-slate-700 mb-4">Transaction History</h2>
            
            <div class="overflow-y-auto flex-grow max-h-[500px]" id="transaction-list-container">
                <ul id="transaction-list" class="divide-y divide-slate-100">
                    <!-- Dynamic Items Go Here -->
                </ul>
                <div id="empty-state" class="text-center py-12 text-slate-400 hidden">
                    <i class="fa-solid fa-receipt text-3xl mb-2"></i>
                    <p class="text-sm">No transactions recorded yet.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white">
        Transaction Manager PWA &copy; 2026
    </footer>

    <!-- App Logic -->
    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        const form = document.getElementById('transaction-form');
        const descriptionInput = document.getElementById('description');
        const amountInput = document.getElementById('amount');
        const typeInput = document.getElementById('type');
        const transactionList = document.getElementById('transaction-list');
        const emptyState = document.getElementById('empty-state');
        
        const netBalanceEl = document.getElementById('net-balance');
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newTransaction = {
                id: Date.now(),
                description: descriptionInput.value.trim(),
                amount: parseFloat(amountInput.value),
                type: typeInput.value
            };

            transactions.unshift(newTransaction);
            saveAndRender();
            form.reset();
        });

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveAndRender();
        }

        function clearAllTransactions() {
            if (confirm("Are you sure you want to clear all transaction records?")) {
                transactions = [];
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
            render();
        }

        function render() {
            transactionList.innerHTML = '';
            
            let income = 0;
            let expense = 0;

            if (transactions.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                transactions.forEach(t => {
                    if (t.type === 'income') {
                        income += t.amount;
                    } else {
                        expense += t.amount;
                    }

                    const li = document.createElement('li');
                    li.className = "py-3 flex justify-between items-center group";
                    
                    const isIncome = t.type === 'income';
                    const amountSign = isIncome ? '+' : '-';
                    const amountColor = isIncome ? 'text-emerald-600' : 'text-slate-700';

                    li.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full flex items-center justify-center ${isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                                <i class="fa-solid ${isIncome ? 'fa-arrow-down' : 'fa-arrow-up'} text-xs"></i>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-slate-800">${escapeHtml(t.description)}</p>
                                <span class="text-[10px] uppercase font-semibold tracking-wider text-slate-400">${t.type}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-sm font-semibold ${amountColor}">${amountSign}$${t.amount.toFixed(2)}</span>
                            <button onclick="deleteTransaction(${t.id})" class="text-slate-300 hover:text-rose-500 transition opacity-0 group-hover:opacity-100">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    `;
                    transactionList.appendChild(li);
                });
            }

            const net = income - expense;
            netBalanceEl.textContent = `$${net.toFixed(2)}`;
            netBalanceEl.className = `text-2xl font-bold ${net >= 0 ? 'text-slate-800' : 'text-rose-600'}`;
            totalIncomeEl.textContent = `+$${income.toFixed(2)}`;
            totalExpenseEl.textContent = `-$${expense.toFixed(2)}`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial render on load
        render();
    </script>
</body>
</html>
